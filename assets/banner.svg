<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Monish MR - AI and Backend Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0b2a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#7ee0c3"/>
      <stop offset="1" stop-color="#f0c05a"/>
      <animate attributeName="x1" values="0;0.4;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee0c3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7ee0c3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1000" height="240" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <circle cx="180" cy="60" r="180" fill="url(#glow1)">
      <animate attributeName="cx" values="180;260;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="840" cy="200" r="200" fill="url(#glow2)">
      <animate attributeName="cx" values="840;760;840" dur="14s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000"/>
      <path d="M100 0V240M200 0V240M300 0V240M400 0V240M500 0V240M600 0V240M700 0V240M800 0V240M900 0V240"/>
    </g>
    <text x="500" y="108" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="1">Monish MR</text>
    <text x="500" y="152" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#c9d1d9" letter-spacing="6">AI  ·  BACKEND  ·  PRODUCTS</text>
    <text x="500" y="192" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#8b949e">I turn ideas into practical products with AI, APIs, data, and thoughtful user experiences.</text>
  </g>
  <rect x="1" y="1" width="998" height="238" rx="15" fill="none" stroke="#30363d"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
